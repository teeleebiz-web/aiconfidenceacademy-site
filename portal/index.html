<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102d4f" />
    <meta
      name="description"
      content="The secure AI Confidence Academy learner portal."
    />
    <title>ACA Learner Portal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const params = new URLSearchParams(window.location.search)
      const controlCenter = /^\/control-center\/?$/.test(window.location.pathname)
        || ['enrollments', 'operations'].includes(params.get('view') || '')
      if (!controlCenter && (params.get('review') === 'phase-two' || params.get('course') === 'phase-two')) {
        const style = document.createElement('link')
        style.rel = 'stylesheet'
        style.href = '/learn/assets/index-CtQ8Sk9n.css'
        document.head.appendChild(style)
        const phaseTwoEntry = '/learn/assets/index-D4naDH8y.js'
        await import(/* @vite-ignore */ phaseTwoEntry)
      } else {
        await import('./src/main.tsx')
      }
      if (!/^\/control-center\/?$/.test(window.location.pathname)) await import('./src/support.tsx')
    </script>
  </body>
</html>
