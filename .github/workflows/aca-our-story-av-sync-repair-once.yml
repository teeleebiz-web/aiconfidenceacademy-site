name: Repair Our Story presenter audio and video sync (normalized source)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aca-our-story-av-sync-repair-once.yml'
permissions:
  contents: write
concurrency:
  group: aca-our-story-av-repair
  cancel-in-progress: false
jobs:
  av-sync:
    if: github.event.head_commit.message == 'Run verified Our Story A/V repair using original Jeff footage'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact original Our Story A/V and only temporary repair tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          sparse-checkout: |
            assets/videos/founders-shared-welcome
            .github/scripts/aca-our-story-av-sync-repair.sh
            .github/workflows/aca-our-story-av-sync-repair-once.yml
            .github/workflows/aca-our-story-jeff-source-check-once.yml
          sparse-checkout-cone-mode: false
      - name: Ensure media tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | sed -n '1p'
      - name: Independently check original Jeff audio/video alignment and publish only when passing
        shell: bash
        env:
          RECREATED_FOUNDER_URL: 'https://files2.heygen.ai/aws_pacific/avatar_tmp/2a66eb7bf096465e8cfbd33e2c75dd54/acef491661b4cd3c3b0d219a05485dac.mp4?Expires=1795425182&Signature=w~qTLTUvgyCGFVgI9Hb84cxHU5ak1~F7OaGWCllIN7En5HbelSO4xZ297ghVOWkPLTBMySFLxWzItismv00FjHK6h~-KakvmEn1ieWDazGlVvr9gStlrmf2IxlY0EzaVZjfpjOn3D-~lOaIDsfIXqRw6BPAdHCxTSdFE~upYPKeXqiyBuFshLMxnlKRkemrouBaN3JNDQAOaLEUcopdjDEmMsGL6Wop7BPlTstLdjBjM~iPCuUSsS3B7wJ9UL6nUxk1vk9H282hkmc5UlvnzsrGTvAhl7seIe-T0K-V5xBSDkhOZfe2vapYmUiAcLAHIirf3QXgVvXltsk6AK7F77Q__&Key-Pair-Id=K3TSZ3KU01LY58'
        run: |
          bash .github/scripts/aca-our-story-av-sync-repair.sh
