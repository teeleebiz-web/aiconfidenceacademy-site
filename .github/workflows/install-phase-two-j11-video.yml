name: ACA approved Phase Two Lesson 1.1 instructor media

on:
  push:
    branches:
      - phase-two-six-journey-owner-review
    paths:
      - .github/workflows/install-phase-two-j11-video.yml
      - academy/PHASE-TWO-VIDEO-RELEASE.flag

permissions:
  contents: write

jobs:
  prepare-approved-video:
    if: github.event.head_commit.message == 'Install approved Phase Two Lesson 1.1 video media on Academy domain'
    runs-on: ubuntu-latest
    steps:
      - name: Check out protected reviewed source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Python for Academy cards
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install picture-generation dependency and media codecs
        run: |
          set -euo pipefail
          python -m pip install 'Pillow==11.2.1'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Build approved instructor video with embedded ACA cards
        run: |
          set -euo pipefail
          python academy/phase-two-production/build-approved-j11-video.py "$RUNNER_TEMP/aca-j11-complete"

      - name: Install only approved media assets into existing Academy site
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add --detach "$RUNNER_TEMP/aca-official-media" origin/main
          cd "$RUNNER_TEMP/aca-official-media"
          media_dir="assets/videos/phase-two-lesson-1-1"
          test ! -e "$media_dir/ACA-Phase-Two-Lesson-1-1-Introduction.mp4"
          test ! -e "$media_dir/poster.webp"
          mkdir -p "$media_dir"
          cp "$RUNNER_TEMP/aca-j11-complete/ACA-Phase-Two-Lesson-1-1-Introduction.mp4" "$media_dir/"
          cp "$RUNNER_TEMP/aca-j11-complete/poster.webp" "$media_dir/"
          cp "$RUNNER_TEMP/aca-j11-complete/media-manifest.json" "$media_dir/"
          test "$(stat -c '%s' "$media_dir/ACA-Phase-Two-Lesson-1-1-Introduction.mp4")" -lt 48000000
          git add "$media_dir/"
          git diff --cached --name-status
          if git diff --cached --name-status | grep -Ev '^A[[:space:]]+assets/videos/phase-two-lesson-1-1/'; then
            echo "Unexpected change blocked: the approved video must be additive-only." >&2
            exit 1
          fi
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git config user.name "ACA approved media builder"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Add approved Phase Two Lesson 1.1 instructor video with opening and ending cards"
          git push origin HEAD:main
