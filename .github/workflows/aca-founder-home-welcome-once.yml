name: One-time ACA founder homepage welcome insertion
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aca-founder-home-welcome-once.yml'
permissions:
  contents: write
concurrency:
  group: aca-founder-home-welcome-only
  cancel-in-progress: false
jobs:
  insert-founder:
    if: github.event.head_commit.message == 'Run ACA founder homepage introduction insertion with revised Anna'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the exact approved homepage media and player
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          sparse-checkout: |
            assets/videos/aca-introduction
            assets/home-introduction.js
            index.html
            .github/workflows/aca-founder-home-welcome-once.yml
          sparse-checkout-cone-mode: false
      - name: Check media tooling
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          command -v ffprobe
          command -v ffmpeg
          ffmpeg -version | sed -n '1p'
      - name: Insert approved Terrence clip after the existing opening card and retain the entire revised Anna film
        shell: bash
        env:
          FOUNDER_URL: 'https://files2.heygen.ai/aws_pacific/avatar_tmp/2a66eb7bf096465e8cfbd33e2c75dd54/e13b66794a39fa288ce349b4dfe6c995.mp4?Expires=1795423943&Signature=wOqYZHw07dMVk9XowpSL8dqx5WBlHpl8W6PryBaIa3dqQpt14RmcJIY~OG7yGrFR4eCUDpNoZY3SCU9j28YfwMhGq-m67RwdMBLs-HpVEclZ5u9qzLzdRiPHOmsO6NE84aa0Xg4ftQ5Pc92WysUGOEgJfDqBF0w9~7uOWm2-FPEtG8b2TWZ6aaNAI~NQ-7h4gH6vNkZg0UxvAFqvWCMQYpxH4ezGumf9DR9tdE~Uy2EsEimJtew~EN0Xjc6HuT6mrf9A6qL9ifMcj7N4DuyZNtt0txsGoMzCBOEKybv9TQ2Z-uwQkkpxQFVkaAJYbBElWX8aA8LBiOswQy62SndZcg__&Key-Pair-Id=K3TSZ3KU01LY58'
        run: |
          set -euo pipefail
          SOURCE="assets/videos/aca-introduction"
          TMP="$(mktemp -d)"
          mkdir -p "$TMP/hls"
          curl --fail --location --silent --show-error --retry 3 "$FOUNDER_URL" -o "$TMP/terrence.mp4"

          python3 - "$SOURCE" "$TMP/terrence.mp4" <<'PY'
          import json, pathlib, subprocess, sys
          source=pathlib.Path(sys.argv[1])
          clip=pathlib.Path(sys.argv[2])
          expected=('part-00.m4s', 'part-24.m4s', 'init.mp4','film.m3u8')
          assert all((source / n).exists() for n in expected), 'Current approved Anna film is missing or differs'
          def probe(f):
              return json.loads(subprocess.check_output([
                'ffprobe','-v','error','-show_entries',
                'stream=codec_type,width,height:format=duration','-of','json',str(f)
              ],text=True))
          founder=probe(clip)
          assert abs(float(founder['format']['duration'])-89.7045)<0.25, founder['format']
          v=[s for s in founder['streams'] if s.get('codec_type')=='video']
          a=[s for s in founder['streams'] if s.get('codec_type')=='audio']
          assert len(v)==1 and a and (v[0]['width'],v[0]['height'])==(1920,1080), founder
          old=probe(source/'film.m3u8')
          assert abs(float(old['format']['duration'])-242.48)<0.25, 'Expected November 13 updated Anna film, refusing to modify a different base video'
          assert len(list(source.glob('part-*.m4s')))==25, 'Expected original 25 fragments'
          print('Confirmed exact approved Anna-Nov13 base film (242.48s) and Terrence original (89.70s).')
          PY

          # Preserve all existing scenes, soundtrack and the revised Anna
          # appearances, except moving the first three seconds opening card
          # to precede the new Terrence introduction.
          ffmpeg -hide_banner -loglevel error -i "$SOURCE/film.m3u8" \
            -map 0:v:0 -map 0:a:0 -c:v copy \
            -af "asetpts=N/SR/TB" -c:a aac -ar 48000 \
            -movflags +faststart -y "$TMP/current-normalized.mp4"
          cat > "$TMP/film-filter.txt" <<'FILTER'
          [0:v]trim=start=0:end=3,setpts=PTS-STARTPTS,scale=1920:1080,setsar=1,settb=AVTB,fps=25,format=yuv420p[vcard];
          [0:a]atrim=start=0:end=3,asetpts=PTS-STARTPTS,aresample=48000[acard];
          [1:v]tpad=stop_mode=clone:stop_duration=0.75,trim=duration=90.45,setpts=PTS-STARTPTS,scale=1920:1080,setsar=1,settb=AVTB,fps=25,format=yuv420p[vterr];
          [1:a]apad=pad_dur=0.75,atrim=duration=90.45,asetpts=PTS-STARTPTS,aresample=48000[aterr];
          [0:v]trim=start=3:end=242.48,setpts=PTS-STARTPTS,scale=1920:1080,setsar=1,settb=AVTB,fps=25,format=yuv420p[vrest];
          [0:a]atrim=start=3:end=242.48,asetpts=PTS-STARTPTS,aresample=48000[arest];
          [vterr][vrest]xfade=transition=fade:duration=0.65:offset=89.80[vtr];
          [aterr][arest]acrossfade=d=0.65:c1=tri:c2=tri[atr];
          [vcard][acard][vtr][atr]concat=n=2:v=1:a=1[v][a]
          FILTER
          sed -i 's/^          //' "$TMP/film-filter.txt"
          ffmpeg -hide_banner -loglevel error \
            -i "$TMP/current-normalized.mp4" -i "$TMP/terrence.mp4" \
            -filter_complex_script "$TMP/film-filter.txt" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset veryfast -crf 20 -profile:v high -level:v 4.1 \
            -pix_fmt yuv420p -r 25 -g 250 -keyint_min 25 -sc_threshold 0 \
            -force_key_frames "expr:gte(t,2+(n_forced-1)*10)" \
            -c:a aac -b:a 160k -ac 2 -ar 48000 \
            -movflags +faststart -y "$TMP/assembled.mp4"

          # A dedicated 2-second initial fragment improves response after
          # tapping Play; the rest of the film streams as standard segments.
          ffmpeg -hide_banner -loglevel error -i "$TMP/assembled.mp4" \
            -map 0:v:0 -map 0:a:0 -c copy \
            -f hls -hls_time 2 -hls_playlist_type vod -hls_segment_type fmp4 \
            -hls_flags independent_segments \
            -hls_fmp4_init_filename "init.mp4" \
            -hls_segment_filename "$TMP/hls/part-%03d.m4s" \
            "$TMP/hls/film.m3u8"
          ffmpeg -v error -i "$TMP/hls/film.m3u8" -f null -
          python3 - "$TMP/hls/film.m3u8" <<'PY'
          import pathlib, re, subprocess, sys
          m=pathlib.Path(sys.argv[1])
          playlist=m.read_text()
          lines=playlist.splitlines()
          assert lines[0]=='#EXTM3U' and '#EXT-X-ENDLIST' in lines
          assert '#EXT-X-INDEPENDENT-SEGMENTS' in lines
          durations=[float(x) for x in re.findall(r'#EXTINF:([0-9.]+)',playlist)]
          assert durations and 1.80 <= durations[0] <=2.15, durations[:3]
          assert len(durations)>=30 and max(durations)<10.5, (len(durations),max(durations))
          total=sum(durations)
          assert 331.4 <= total <=333.2, total
          assert 'part-000.m4s' in playlist
          assert all((m.parent / f'part-{i:03d}.m4s').exists() for i in range(len(durations)))
          assert (m.parent/'init.mp4').exists()
          print(f'Complete new welcome film decodes; duration {total:.2f}s; first segment {durations[0]:.2f}s; {len(durations)} fragments.')
          PY

          # Replace only the homepage Welcome video stream: retain existing
          # poster, section, other presenters, Anna updates and closing card.
          rm -f "$SOURCE"/part-*.m4s "$SOURCE/film.m3u8" "$SOURCE/init.mp4"
          cp "$TMP/hls/film.m3u8" "$SOURCE/film.m3u8"
          cp "$TMP/hls/init.mp4" "$SOURCE/init.mp4"
          cp "$TMP/hls"/part-*.m4s "$SOURCE/"

          cat > assets/home-introduction.js <<'JS'
          (() => {
            document.querySelectorAll('#academy-introduction video, #website-welcome video').forEach((video) => {
              const source = video.querySelector('source');
              if (!source) return;
              const src = source.getAttribute('src');
              if (!src) return;
          
              // Prime the opening fragments immediately so Play does not wait to fetch
              // the manifest and initial video segment.
              video.preload = 'auto';
              if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.load();
                return;
              }
              if (!window.Hls || !window.Hls.isSupported()) return;
              const hls = new window.Hls({
                autoStartLoad: true,
                startFragPrefetch: true,
                maxBufferLength: 18,
                maxMaxBufferLength: 30
              });
              hls.on(window.Hls.Events.MEDIA_ATTACHED, () => hls.loadSource(src));
              hls.attachMedia(video);
            });
          })();
          
          JS
          sed -i 's/^          //' assets/home-introduction.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          html=p.read_text()
          old='preload="none" poster="/assets/videos/aca-introduction-poster.webp"'
          new='preload="auto" poster="/assets/videos/aca-introduction-poster.webp"'
          assert html.count(old)==1, 'Homepage welcome player changed; refusing to edit unrelated markup'
          html=html.replace(old,new,1)
          old_js='/assets/home-introduction.js?v=website-welcome-1'
          new_js='/assets/home-introduction.js?v=founder-welcome-20261116'
          assert html.count(old_js)==1
          html=html.replace(old_js,new_js,1)
          p.write_text(html)
          PY

          git config user.name "ACA homepage welcome media"
          git config user.email "actions@users.noreply.github.com"
          git add -A "$SOURCE" assets/home-introduction.js index.html
          git rm .github/workflows/aca-founder-home-welcome-once.yml
          python3 - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          allowed={'index.html','assets/home-introduction.js','.github/workflows/aca-founder-home-welcome-once.yml'}
          assert names and all(n in allowed or n.startswith('assets/videos/aca-introduction/') for n in names),names
          assert 'assets/videos/aca-introduction/film.m3u8' in names
          print('Authorized change scope validated:',len(names),'files')
          PY
          git commit -m "Add Terrence opening to revised Anna homepage welcome and prime video playback"
          git push origin HEAD:main
          echo "ACA_FOUNDER_REVISED_ANNA_WELCOME_PUBLISHED=1"
