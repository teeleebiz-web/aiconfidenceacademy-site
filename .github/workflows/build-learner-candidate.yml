name: Build ACA learner candidate

on:
  push:
    branches: [fix/learner-academy-welcome]
    paths:
      - 'portal/**'
      - 'academy/AcademyWelcome.tsx'
      - '.github/workflows/build-learner-candidate.yml'

permissions:
  contents: read

jobs:
  verify-and-build:
    if: github.repository == 'teeleebiz-web/aiconfidenceacademy-site'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Preserve assets used by cached learner pages
        run: cp -a learn/assets "$RUNNER_TEMP/aca-previous-learner-assets"
      - name: Verify the source and build the learner portal
        run: npm run check && npm run build:academy
      - name: Commit only generated learner assets to the candidate branch
        env:
          CANDIDATE_BRANCH: fix/learner-academy-welcome
        run: |
          cp -an "$RUNNER_TEMP/aca-previous-learner-assets/." learn/assets/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learn
          if git diff --cached --quiet; then exit 0; fi
          test "$(git ls-remote origin "refs/heads/$CANDIDATE_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git commit -m 'Build verified ACA learner welcome assets'
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
