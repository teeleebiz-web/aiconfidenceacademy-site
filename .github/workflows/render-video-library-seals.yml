name: Render approved Video Library seals
on:
  push:
    branches: [aca-video-library-seal-render]
permissions:
  contents: write
jobs:
  render:
    if: github.event.head_commit.message == 'Render approved ACA Video Library seals'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: |
            aca-official-seal.png
            videos/index.html
            scripts/render-video-library-seals.py
            assets/videos/begin-using-ai-cream
            assets/videos/trusting-ai-cream
            assets/videos/learning-with-aca-anna-extended
            assets/videos/confidence-with-ai-man-extended
            assets/videos/why-learn-ai-seated
            assets/videos/what-is-ai
          sparse-checkout-cone-mode: false
      - name: Render and verify the six presenter streams
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python3 scripts/render-video-library-seals.py
      - name: Commit validated media to the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse assets/video-library-branded
          git commit -m 'Add verified branded Video Library streams'
          git push origin HEAD:aca-video-library-seal-render
