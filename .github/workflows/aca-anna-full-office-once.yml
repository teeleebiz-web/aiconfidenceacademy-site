name: One-time ACA Anna full-office landscape replacement
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aca-anna-full-office-once.yml'
permissions:
  contents: write
concurrency:
  group: aca-anna-full-office-only
  cancel-in-progress: false
jobs:
  replace-anna:
    if: github.event.head_commit.message == 'Run ACA Anna full-office welcome replacement only'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current live Welcome film and one-time task
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          sparse-checkout: |
            assets/videos/aca-introduction
            .github/workflows/aca-anna-full-office-once.yml
          sparse-checkout-cone-mode: false
      - name: Ensure media tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Replace only two Anna scenes and hold after her final line
        shell: bash
        env:
          ANNA_FIRST_URL: 'https://files2.heygen.ai/aws_pacific/avatar_tmp/2a66eb7bf096465e8cfbd33e2c75dd54/c09a2b4a463c20cf4a5b440eefd94d2d.mp4?Expires=1795166746&Signature=bot4mgV1Ow7OCNjPy8iQ-lWJYj7l4xPEOAqwgDRRIL5CR1sBgtWjjxq8yWqQicQjY3pA0M4wPTiRZHvXc9~qEdnPYuOracpNrD7aSbtdxfx5-31VgbpVW2tpnJfYKhrFJ2mZWnmMcS-csxjCvI8JmoiZ9SqDIR6kvrWu3HipJlSLDPyk5jJzc6uz3GWNroXJxE2WmLXhOP4zkGdfIcJ32GtETQfHarsNPrnFvgyDzbC8Y1lorBZsGb57VmMNC8EeL9-Zc3FfYNlkdMWCCza-EkugPllY5q8a6hdITBPna3RcCqUC-HlbAFqgi5ANIFkAzyPwMsa4zP-MjKuHu1K5Jg__&Key-Pair-Id=K38HBHX5LX3X2H'
          ANNA_LAST_URL: 'https://files2.heygen.ai/aws_pacific/avatar_tmp/2a66eb7bf096465e8cfbd33e2c75dd54/48413f12c26f36b90567d7026fde46d2.mp4?Expires=1795166715&Signature=lglhuK6RFWNo5-115zSb25hnQcyHgbAFWSI3Jcx-P9JErxzRoQLXlLjiarTGt4ZKVykb1GGGJ98-X-LSgvt~~HGAozjfH0dlfcbBtsnWM2QallbMXn4D1XSfJNZGzKN5VEv5AL1lCk6lC-s85sKFFrO037TdIEJ5cWQWpPq9-MEhHxeKoKylmA65~jRrF389wLpg5qVEZqBIURNImXHVSJ6YasOUC4lhyymQpBbQEF-vmNKnaCO6xAbdnWPZA2wryHES~AK0Ipeui3kWrNoKykidPwYBoJWsmF6jgewB4wrlm4veklfRoycB8Bqo0dOsH~4SPrdDqMtD~jYtWeRuyg__&Key-Pair-Id=K38HBHX5LX3X2H'
        run: |
          set -euo pipefail
          SOURCE="assets/videos/aca-introduction"
          TMP="$(mktemp -d)"
          mkdir -p "$TMP/hls"
          curl --fail --location --silent --show-error --retry 3 "$ANNA_FIRST_URL" -o "$TMP/anna1.mp4"
          curl --fail --location --silent --show-error --retry 3 "$ANNA_LAST_URL" -o "$TMP/anna2.mp4"

          python3 - "$TMP" <<'PY'
          import json,pathlib,subprocess,sys
          root=pathlib.Path(sys.argv[1])
          for name,approx in (("anna1.mp4",47.6735),("anna2.mp4",31.8171)):
              f=root/name
              j=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries","stream=codec_type,width,height:format=duration","-of","json",str(f)],text=True))
              videos=[x for x in j["streams"] if x.get("codec_type")=="video"]
              audio=[x for x in j["streams"] if x.get("codec_type")=="audio"]
              assert len(videos)==1 and len(audio)>=1,(name,j)
              assert (videos[0]["width"],videos[0]["height"])==(1920,1080),(name,videos)
              assert abs(float(j["format"]["duration"])-approx)<0.25,(name,j["format"])
          print("Approved Anna full-office originals verified: 1920x1080 and expected speech durations")
          PY

          # The existing six-presenter homepage HLS has 25 parts and runs 240.20s.
          # Do not replace any HTML, poster, other speaker media, or website feature.
          SOURCE_DURATION="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$SOURCE/film.m3u8")"
          python3 - "$SOURCE_DURATION" <<'PY'
          import sys
          d=float(sys.argv[1])
          assert abs(d-240.2)<0.25, f"Unexpected live Welcome film source: {d}"
          print(f"Current published film duration verified: {d:.3f}s")
          PY

          # Normalize current source audio PTS; keep original video frames for unaffected scenes.
          ffmpeg -hide_banner -loglevel error -i "$SOURCE/film.m3u8" \
            -map 0:v:0 -map 0:a:0 -c:v copy -af "asetpts=N/SR/TB" -c:a aac -ar 48000 \
            -movflags +faststart -y "$TMP/current-normalized.mp4"

          # Exact scene boundaries are based on the previous founder-approved film:
          #   0..92          all original speakers before Anna, unchanged
          #   92..139.56     old Anna first turn --> new full-office Anna
          #   139.56..204.36 original other presenters, unchanged
          #   204.36..236.04 old Anna final turn --> new full-office Anna
          #   236.04..240.20 existing final card, unchanged
          # New last turn ends at approx 31.84s. Hold Anna's final image for 2.00s
          # before any closing fade begins, then dissolve over 0.80s to the same end card.
          cat > "$TMP/film-filter.txt" <<'FILTER'
          [0:v]trim=start=0:end=92,setpts=PTS-STARTPTS,fps=25,scale=1920:1080,setsar=1,format=yuv420p[v0];
          [0:a]atrim=start=0:end=92,asetpts=PTS-STARTPTS,aresample=48000[a0];
          [1:v]fps=25,scale=1920:1080,setsar=1,setpts=PTS-STARTPTS,format=yuv420p[v1];
          [1:a]aresample=48000,asetpts=PTS-STARTPTS[a1];
          [0:v]trim=start=139.56:end=204.36,setpts=PTS-STARTPTS,fps=25,scale=1920:1080,setsar=1,format=yuv420p[v2];
          [0:a]atrim=start=139.56:end=204.36,asetpts=PTS-STARTPTS,aresample=48000[a2];
          [2:v]fps=25,scale=1920:1080,setsar=1,format=yuv420p,tpad=stop_mode=clone:stop_duration=2.8,trim=duration=34.64,setpts=PTS-STARTPTS[annafinish];
          [0:v]trim=start=236.04:end=240.20,setpts=PTS-STARTPTS,fps=25,scale=1920:1080,setsar=1,format=yuv420p[closingcard];
          [annafinish][closingcard]xfade=transition=fade:duration=0.8:offset=33.84[vlast];
          [2:a]aresample=48000,asetpts=PTS-STARTPTS,apad=pad_dur=6.40,atrim=duration=38.00[alast];
          [v0][a0][v1][a1][v2][a2][vlast][alast]concat=n=4:v=1:a=1[v][a]
          FILTER
          sed -i 's/^          //' "$TMP/film-filter.txt"

          ffmpeg -hide_banner -loglevel error \
            -i "$TMP/current-normalized.mp4" -i "$TMP/anna1.mp4" -i "$TMP/anna2.mp4" \
            -filter_complex_script "$TMP/film-filter.txt" -map "[v]" -map "[a]" \
            -c:v libx264 -preset fast -crf 20 -profile:v high -level:v 4.1 \
            -pix_fmt yuv420p -r 25 -g 250 -keyint_min 250 -sc_threshold 0 \
            -force_key_frames "expr:gte(t,n_forced*10)" \
            -c:a aac -b:a 160k -ac 2 -ar 48000 \
            -movflags +faststart -y "$TMP/assembled.mp4"

          # Deliver to the exact existing HLS location used by the homepage player.
          ffmpeg -hide_banner -loglevel error -i "$TMP/assembled.mp4" -c copy \
            -f hls -hls_time 10 -hls_playlist_type vod -hls_segment_type fmp4 \
            -hls_fmp4_init_filename "init.mp4" \
            -hls_segment_filename "$TMP/hls/part-%02d.m4s" "$TMP/hls/film.m3u8"
          ffmpeg -v error -i "$TMP/hls/film.m3u8" -f null -

          FINAL_DURATION="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$TMP/hls/film.m3u8")"
          python3 - "$FINAL_DURATION" <<'PY'
          import sys
          d=float(sys.argv[1])
          assert 242.1 <= d <= 243.0, f"Unexpected new film duration: {d}"
          print(f"New homepage film verified, including two-second final hold: {d:.3f}s")
          PY
          test -s "$TMP/hls/film.m3u8"
          test -s "$TMP/hls/init.mp4"
          test "$(find "$TMP/hls" -name '*.m4s' | wc -l)" -ge 24
          # Preserve original poster, page code, other videos, and all unrelated files.
          rm -f "$SOURCE"/part-*.m4s "$SOURCE/film.m3u8" "$SOURCE/init.mp4"
          cp "$TMP/hls/film.m3u8" "$SOURCE/film.m3u8"
          cp "$TMP/hls/init.mp4" "$SOURCE/init.mp4"
          cp "$TMP/hls"/part-*.m4s "$SOURCE/"
          git config user.name "ACA Anna Welcome media replacement"
          git config user.email "actions@users.noreply.github.com"
          git add -A "$SOURCE"
          git rm .github/workflows/aca-anna-full-office-once.yml
          python3 - <<'PY'
          import subprocess
          files=subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines()
          assert files
          assert all(f.startswith("assets/videos/aca-introduction/") or f==".github/workflows/aca-anna-full-office-once.yml" for f in files), files
          assert "assets/videos/aca-introduction/film.m3u8" in files
          print("Change scope passed: existing Welcome film assets only.")
          PY
          git commit -m "Replace Anna with approved full-office scene and delay closing card"
          git push origin HEAD:main
          echo "ACA_FULL_OFFICE_ANNA_PUBLISHED=1"
