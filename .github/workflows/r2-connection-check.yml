name: ACA private R2 connection check

on:
  workflow_dispatch:
    inputs:
      private_destination:
        description: 'Verified private Cloudflare account ID/aca-private-backups'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aca-r2-connection-check
  cancel-in-progress: false

jobs:
  verify-connection:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the reviewed main revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify recovery code without live credentials
        run: npm run test:recovery

      - name: Encrypt, transfer, download and recover a small synthetic file
        env:
          ACA_R2_PRIVATE_CONFIRMED: ${{ inputs.private_destination }}
          ACA_R2_ACCESS_KEY_ID: ${{ secrets.ACA_R2_ACCESS_KEY_ID }}
          ACA_R2_SECRET_ACCESS_KEY: ${{ secrets.ACA_R2_SECRET_ACCESS_KEY }}
        run: node operations/r2-connection-check.mjs
