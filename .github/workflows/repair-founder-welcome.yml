name: One-time founder welcome media repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Run founder welcome media repair'
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b163ce8339167e909e55317d12 # v4.2.2
        with:
          fetch-depth: 1

      - name: Verify media tools
        run: |
          set -euo pipefail
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Rebuild only the four founder-welcome media fragments
        shell: bash
        run: |
          set -euo pipefail
          SHARED="assets/videos/founders-shared-welcome/film.m3u8"
          TERR="assets/videos/website-welcome/film.m3u8"
          OUT="assets/videos/founders-shared-welcome"
          TMP="$(mktemp -d)"
          mkdir -p "$TMP/open" "$TMP/audio" "$TMP/end"

          # Reuse the already-approved cream cards and Jeff's approved final frame.
          ffmpeg -v error -ss 1.0 -i "$SHARED" -frames:v 1 -y "$TMP/opening.png"
          ffmpeg -v error -ss 309.5 -i "$SHARED" -frames:v 1 -y "$TMP/ending.png"
          ffmpeg -v error -ss 308.85 -i "$SHARED" -frames:v 1 -y "$TMP/jeff_last.png"

          # Match the codec parameters already used by the live shared film.
          # 1280x720, 25fps, H.264 High@3.1, AAC 48k stereo.
          COMMON_V="-c:v libx264 -preset fast -crf 20 -profile:v high -level:v 3.1 -bf 2 -pix_fmt yuv420p -r 25 -video_track_timescale 12800"
          COMMON_A="-c:a aac -ar 48000 -ac 2 -b:a 160k"

          # part00: keep the approved cream opening visible for the full first five seconds.
          # This completely replaces the old blue beginning card without changing the rest of the timeline.
          ffmpeg -v error -loop 1 -i "$TMP/opening.png" -ss 5 -to 15 -i "$SHARED" \
            -filter_complex "[0:v]scale=1280:720,setsar=1,fps=25,trim=duration=5,setpts=PTS-STARTPTS[v0];anullsrc=r=48000:cl=stereo,atrim=duration=5,asetpts=PTS-STARTPTS[a0];[1:v]scale=1280:720,setsar=1,fps=25,setpts=PTS-STARTPTS[v1];[1:a]aresample=48000:async=1,asetpts=PTS-STARTPTS[a1];[v0][a0][v1][a1]concat=n=2:v=1:a=1[v][a]" \
            -map "[v]" -map "[a]" $COMMON_V -g 250 -keyint_min 250 -sc_threshold 0 $COMMON_A -t 15 -y "$TMP/open_patch.mp4"
          ffmpeg -v error -i "$TMP/open_patch.mp4" -c copy -f hls -hls_time 15 -hls_playlist_type vod -hls_segment_type fmp4 -hls_segment_filename "$TMP/open/seg%02d.m4s" "$TMP/open/film.m3u8"

          # part15 + part16: preserve the existing picture but restore Terrence's intact source audio.
          # Shared timeline 155-171.12 maps to the original Terrence source at 152-168.12.
          ffmpeg -v error -ss 155 -to 171.12 -i "$SHARED" -ss 152 -to 168.12 -i "$TERR" \
            -map 0:v:0 -map 1:a:0 -vf "scale=1280:720,setsar=1,fps=25" -af "aresample=48000:async=1" \
            $COMMON_V -g 250 -keyint_min 250 -sc_threshold 0 $COMMON_A -t 16.12 -y "$TMP/audio_patch.mp4"
          ffmpeg -v error -i "$TMP/audio_patch.mp4" -c copy -f hls -hls_time 8 -hls_playlist_type vod -hls_segment_type fmp4 -hls_segment_filename "$TMP/audio/seg%02d.m4s" "$TMP/audio/film.m3u8"

          # part31: after Jeff's final words, hold his final frame 1.75 seconds,
          # then hold the approved cream thank-you card for four seconds.
          ffmpeg -v error -loop 1 -i "$TMP/jeff_last.png" -loop 1 -i "$TMP/ending.png" \
            -filter_complex "[0:v]scale=1280:720,setsar=1,fps=25,trim=duration=1.75,setpts=PTS-STARTPTS[v0];anullsrc=r=48000:cl=stereo,atrim=duration=1.75,asetpts=PTS-STARTPTS[a0];[1:v]scale=1280:720,setsar=1,fps=25,trim=duration=4,setpts=PTS-STARTPTS[v1];anullsrc=r=48000:cl=stereo,atrim=duration=4,asetpts=PTS-STARTPTS[a1];[v0][a0][v1][a1]concat=n=2:v=1:a=1[v][a]" \
            -map "[v]" -map "[a]" $COMMON_V -g 250 -keyint_min 250 -sc_threshold 0 $COMMON_A -t 5.75 -y "$TMP/end_patch.mp4"
          ffmpeg -v error -i "$TMP/end_patch.mp4" -c copy -f hls -hls_time 8 -hls_playlist_type vod -hls_segment_type fmp4 -hls_segment_filename "$TMP/end/seg%02d.m4s" "$TMP/end/film.m3u8"

          cp "$TMP/open/seg00.m4s" "$OUT/part00.m4s"
          cp "$TMP/audio/seg00.m4s" "$OUT/part15.m4s"
          cp "$TMP/audio/seg01.m4s" "$OUT/part16.m4s"
          cp "$TMP/end/seg00.m4s" "$OUT/part31.m4s"

          cat > "$OUT/film.m3u8" <<'PLAYLIST'
          #EXTM3U
          #EXT-X-VERSION:7
          #EXT-X-TARGETDURATION:15
          #EXT-X-MEDIA-SEQUENCE:0
          #EXT-X-PLAYLIST-TYPE:VOD
          #EXT-X-MAP:URI="init.mp4"
          #EXTINF:15.000000,
          part00.m4s
          #EXTINF:10.000000,
          part01.m4s
          #EXTINF:10.000000,
          part02.m4s
          #EXTINF:10.000000,
          part03.m4s
          #EXTINF:10.000000,
          part04.m4s
          #EXTINF:10.000000,
          part05.m4s
          #EXTINF:10.000000,
          part06.m4s
          #EXTINF:10.000000,
          part07.m4s
          #EXTINF:10.000000,
          part08.m4s
          #EXTINF:10.000000,
          part09.m4s
          #EXTINF:10.000000,
          part10.m4s
          #EXTINF:10.000000,
          part11.m4s
          #EXTINF:10.000000,
          part12.m4s
          #EXTINF:10.000000,
          part13.m4s
          #EXTINF:10.000000,
          part14.m4s
          #EXT-X-DISCONTINUITY
          #EXT-X-MAP:URI="init.mp4"
          #EXTINF:10.000000,
          part15.m4s
          #EXTINF:6.120000,
          part16.m4s
          #EXT-X-DISCONTINUITY
          #EXT-X-MAP:URI="init.mp4"
          #EXTINF:10.000000,
          part17.m4s
          #EXTINF:10.000000,
          part18.m4s
          #EXTINF:10.000000,
          part19.m4s
          #EXTINF:10.000000,
          part20.m4s
          #EXTINF:10.000000,
          part21.m4s
          #EXTINF:10.000000,
          part22.m4s
          #EXTINF:10.000000,
          part23.m4s
          #EXTINF:10.000000,
          part24.m4s
          #EXTINF:10.000000,
          part25.m4s
          #EXTINF:10.000000,
          part26.m4s
          #EXTINF:10.000000,
          part27.m4s
          #EXTINF:10.000000,
          part28.m4s
          #EXTINF:10.000000,
          part29.m4s
          #EXTINF:7.880000,
          part30.m4s
          #EXT-X-DISCONTINUITY
          #EXT-X-MAP:URI="init.mp4"
          #EXTINF:5.760000,
          part31.m4s
          #EXT-X-ENDLIST
          PLAYLIST
          sed -i 's/^          //' "$OUT/film.m3u8"

          # Acceptance checks before publication.
          ffmpeg -v error -i "$OUT/film.m3u8" -f null -
          test "$(grep -c '^#EXT-X-DISCONTINUITY' "$OUT/film.m3u8")" -eq 3
          test "$(grep -c '^part' "$OUT/film.m3u8")" -eq 32

          # The former 12-second silence must be gone.
          if ffmpeg -hide_banner -ss 150 -t 25 -i "$OUT/film.m3u8" -vn -af silencedetect=noise=-45dB:d=1 -f null - 2>&1 | grep -q 'silence_start'; then
            echo "Unexpected long silence remains in Terrence closing remarks." >&2
            exit 1
          fi

          DURATION="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$OUT/film.m3u8")"
          python3 - "$DURATION" <<'PY'
          import sys
          d=float(sys.argv[1])
          assert 314.6 <= d <= 314.9, d
          PY

          git config user.name "ACA media repair"
          git config user.email "actions@users.noreply.github.com"
          git add "$OUT/film.m3u8" "$OUT/part00.m4s" "$OUT/part15.m4s" "$OUT/part16.m4s" "$OUT/part31.m4s"
          git commit -m "Correct founder welcome cards, audio and ending pace"
          git push origin HEAD:main
