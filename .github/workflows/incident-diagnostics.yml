name: ACA private incident diagnostics
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Private storage verification or normal diagnostic collection
        type: choice
        options: [collect, verify-private-storage, verify-provider]
        default: collect
permissions:
  contents: read
concurrency:
  group: aca-private-incident-diagnostics
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify diagnostic guards without live credentials
        run: node --test operations/incident-*.test.mjs
      - name: Collect read-only evidence into private encrypted storage
        env:
          ACA_R2_PRIVATE_CONFIRMED: ce19c01b24230d06b8ba736cccd4414f/aca-private-backups
          ACA_BACKUP_KEY_BASE64: ${{ secrets.ACA_BACKUP_KEY_BASE64 }}
          ACA_BACKUP_SOURCE_SERVICE_ROLE_KEY: ${{ secrets.ACA_BACKUP_SOURCE_SERVICE_ROLE_KEY }}
          ACA_R2_ACCESS_KEY_ID: ${{ secrets.ACA_R2_ACCESS_KEY_ID }}
          ACA_R2_SECRET_ACCESS_KEY: ${{ secrets.ACA_R2_SECRET_ACCESS_KEY }}
          ACA_STATUSCAKE_TOKEN: ${{ secrets.ACA_STATUSCAKE_TOKEN }}
          ACA_INCIDENT_MODE: ${{ inputs.mode || 'collect' }}
        run: node operations/incident-runner.mjs
