name: One-time approved enrollment presentation polish

on:
  push:
    branches: [repair/enrollment-presentation-20261122]
    paths: [scripts/polish-enrollment-video.py]

permissions:
  contents: write

concurrency:
  group: enrollment-presentation-polish-20261122
  cancel-in-progress: false

jobs:
  render:
    if: github.event.head_commit.message == 'Render approved enrollment presentation corrections'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: |
            assets/videos/anna-enrollment
            scripts
          fetch-depth: 1
      - name: Ensure video processing tools
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Render and verify the approved corrections
        run: python3 scripts/polish-enrollment-video.py --output "$RUNNER_TEMP/enrollment-corrected"
      - name: Commit only verified enrollment media to the review branch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cp "$RUNNER_TEMP/enrollment-corrected/"* assets/videos/anna-enrollment/
          git config user.name 'ACA media repair'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/videos/anna-enrollment
          git commit -m 'Install verified enrollment card and background correction'
          git push origin HEAD:refs/heads/repair/enrollment-presentation-20261122
