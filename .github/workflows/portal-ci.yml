name: ACA learner portal checks

on:
  pull_request:
    paths:
      - 'portal/**'
      - 'academy/**'
      - 'api/site.mjs'
      - 'supabase/migrations/**'
      - 'vercel.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/portal-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'portal/**'
      - 'academy/**'
      - 'api/site.mjs'
      - 'supabase/migrations/**'
      - 'vercel.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/portal-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check, test, and build
        run: npm run check
