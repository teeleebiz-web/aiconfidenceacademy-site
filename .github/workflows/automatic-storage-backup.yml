name: ACA automatic private Storage backup

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aca-private-storage-backup
  cancel-in-progress: false

jobs:
  backup-and-recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Record conservative workflow deadline before setup
        run: echo "ACA_BACKUP_WORKFLOW_DEADLINE=$(node -e 'console.log(Date.now()+29*60*1000)')" >> "$GITHUB_ENV"
      - name: Check out the reviewed main revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify recovery and retention code without live credentials
        run: npm run test:recovery
      - name: Apply approved policy and verify encrypted backup recovery
        env:
          ACA_R2_PRIVATE_CONFIRMED: ce19c01b24230d06b8ba736cccd4414f/aca-private-backups
          ACA_BACKUP_OWNER_KEY_SAVED: 'true'
          ACA_BACKUP_SOURCE_ACCESS_CONFIRMED: 'true'
          ACA_BACKUP_KEY_BASE64: ${{ secrets.ACA_BACKUP_KEY_BASE64 }}
          ACA_BACKUP_SOURCE_SERVICE_ROLE_KEY: ${{ secrets.ACA_BACKUP_SOURCE_SERVICE_ROLE_KEY }}
          ACA_R2_ACCESS_KEY_ID: ${{ secrets.ACA_R2_ACCESS_KEY_ID }}
          ACA_R2_SECRET_ACCESS_KEY: ${{ secrets.ACA_R2_SECRET_ACCESS_KEY }}
        run: node operations/automatic-backup.mjs
