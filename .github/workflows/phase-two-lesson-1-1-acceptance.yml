name: Phase Two Lesson 1.1 acceptance
on:
  push:
    branches:
      - fix-phase-two-1-1-captions-and-ai-practice
  pull_request:
    paths:
      - 'learn/**'
      - 'assets/videos/phase-two-lesson-1-1/**'
      - 'academy/phase-two-lesson-1-1-acceptance.test.mjs'
      - '.github/workflows/phase-two-lesson-1-1-acceptance.yml'
jobs:
  lesson-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate official lesson bundle syntax
        run: node --check learn/assets/index-DN1Va1zq.js
      - name: Run Lesson 1.1 media and integration acceptance checks
        run: node --test academy/phase-two-lesson-1-1-acceptance.test.mjs
