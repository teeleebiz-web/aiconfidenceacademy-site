name: Diagnose original Jeff media isolation for AV-safe repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aca-our-story-jeff-source-check-once.yml'
permissions:
  contents: read
jobs:
  original-jeff:
    if: github.event.head_commit.message == 'Diagnose original Jeff A/V before Our Story repair'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read only original preserved Our Story media
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: |
            assets/videos/founders-shared-welcome
          sparse-checkout-cone-mode: false
      - name: Install ffmpeg tools
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          fi
      - name: Test isolated original Jeff and cards with untouched source fragments
        shell: bash
        run: |
          set -euo pipefail
          OUT=assets/videos/founders-shared-welcome
          test "$(git hash-object "$OUT/film.m3u8")" = "2373ce3dbb12c19cbad74b7c2c51bb44c085e841"
          TMP="$(mktemp -d)"
          cat "$OUT/init.mp4" "$OUT"/part{17..30}.m4s > "$TMP/jeff.mp4"
          cat "$OUT/init-end.mp4" "$OUT/part31.m4s" > "$TMP/ending.mp4"
          cat "$OUT/init-open.mp4" "$OUT/part00.m4s" > "$TMP/opening.mp4"
          for clip in jeff ending opening; do
            echo "ACA_PROBE_BEGIN=$clip"
            ffprobe -v error -show_entries format=duration,start_time:stream=index,codec_name,codec_type,start_time,duration,nb_frames -of json "$TMP/$clip.mp4"
            if ffmpeg -hide_banner -loglevel error -xerror -i "$TMP/$clip.mp4" -f null -; then
              echo "ACA_ISOLATED_DECODE_OK=$clip"
            else
              echo "ACA_ISOLATED_DECODE_FAILED=$clip"
            fi
            echo "ACA_PROBE_END=$clip"
          done
          echo 'ACA_CHECK_COMPLETED_NO_WEBSITE_WRITE'
