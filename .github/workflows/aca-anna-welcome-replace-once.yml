name: One-time Anna approved landscape welcome replacement
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aca-anna-welcome-replace-once.yml'
permissions:
  contents: write
concurrency:
  group: aca-anna-home-welcome-once
  cancel-in-progress: false
jobs:
  replace-only-anna:
    if: github.event.head_commit.message == 'ACA one-time Anna landscape welcome replacement authorized'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out just the live homepage video and this temporary workflow
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          sparse-checkout: |
            assets/videos/aca-introduction
            .github/workflows/aca-anna-welcome-replace-once.yml
          sparse-checkout-cone-mode: false
      - name: Install verified media tooling
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Assemble approved Anna inserts, retaining every other scene
        shell: bash
        env:
          ANNA_FIRST_URL: 'https://files2.heygen.ai/aws_pacific/avatar_tmp/2a66eb7bf096465e8cfbd33e2c75dd54/bc02d4c8e1621d19c82cc696773540e1.mp4?Expires=1795097450&Signature=m7S-W~7eAmWP0GoRe9gxrTSkTTeuqN5R0vIMHpZcnQEzJt270HjPgvAuWpM-XxOOS0qamAP5dDzqdq26EtSQOk1yPpUMzYp~EUqRRKUzIAoepD~D9C4xYKFwVpTiUZO4Zik1rFi7QNHVKvbVcOU6GKasOvY1hJrHCI2EtXuLtUXNnoefxM53ys61QzlGttt1yoIPm9FGqjq-Y8MuK3GFtEyLfxWlW8fQ~mTPPTKdL9xjWAhq4~-JLlf57NdTHWsgnZ4cpadIkQrKSis2Gcz-ksCVkbIcEe2hO68Iypy3ClarVAi9gdhR0yoBri21NnFFhgFjq4rWiH1-DXobaRn-wg__&Key-Pair-Id=K38HBHX5LX3X2H'
          ANNA_FINAL_URL: 'https://files2.heygen.ai/aws_pacific/avatar_tmp/2a66eb7bf096465e8cfbd33e2c75dd54/0040d49d1cfbf85450a2da21ce2b363a.mp4?Expires=1795097407&Signature=pl8WA-l1ZzGI9adByQLo2af~k5NRgeAU7YsL1U2PzQPkAKz1qZ5IOAF-TbUGWuUlk-2RAKk6Xs6VHFTUcLjhimge~WpArIAibWglGH07FzEfLX5l0rZFAiqR1YjMtmd0TuHQopBxlOsUU3dwddCnLpS6ojedmvIJB6PYDAMkGhd6s629NPAW7DBz2kxNO8EpBCZ7JcJPtXyk4YmQWwemdXzmmF~7ad3pAuzUQfHLNDCvBb0-o~OiZYV1K6H3VM5F-OU2VAeGS3lCAIaSve9jPjncLHoN59-oanlfK~iNT8s1OlGlO2iE2CNI2Sf~dFKzamHYmQQ8xrVyOot7VRRXGQ__&Key-Pair-Id=K38HBHX5LX3X2H'
        run: |
          set -euo pipefail
          SOURCE_DIR="assets/videos/aca-introduction"
          TMP="$(mktemp -d)"
          mkdir -p "$TMP/hls"
          curl --fail --location --silent --show-error --retry 3 "$ANNA_FIRST_URL" -o "$TMP/anna-first.mp4"
          curl --fail --location --silent --show-error --retry 3 "$ANNA_FINAL_URL" -o "$TMP/anna-final.mp4"

          python3 - "$TMP" <<'PY'
          import json, pathlib, subprocess, sys
          d=pathlib.Path(sys.argv[1])
          expected=[("anna-first.mp4",47.56),("anna-final.mp4",31.68)]
          for name,duration in expected:
              file=d/name
              p=subprocess.run(["ffprobe","-v","error","-show_entries","stream=codec_type,width,height:format=duration","-of","json",str(file)],check=True,capture_output=True,text=True)
              v=json.loads(p.stdout)
              streams=[x for x in v["streams"] if x.get("codec_type")=="video"]
              audio=[x for x in v["streams"] if x.get("codec_type")=="audio"]
              assert len(streams)==1 and audio, (name,v)
              assert (streams[0].get("width"),streams[0].get("height"))==(1920,1080), (name,streams[0])
              assert abs(float(v["format"]["duration"])-duration)<0.4, (name,v["format"])
          print("Both approved Anna landscape originals passed aspect ratio and duration checks")
          PY

          # Preserve the original homepage HLS as input. Normalize the existing HLS audio timestamps.
          ffmpeg -hide_banner -loglevel error -i "$SOURCE_DIR/film.m3u8" \
            -map 0:v:0 -map 0:a:0 -c:v copy -af "asetpts=N/SR/TB" -c:a aac -ar 48000 \
            -movflags +faststart -y "$TMP/original-with-normalized-audio.mp4"
          ORIGINAL_DURATION="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$TMP/original-with-normalized-audio.mp4")"
          python3 - "$ORIGINAL_DURATION" <<'PY'
          import sys
          d=float(sys.argv[1])
          assert abs(d-236.96)<0.20, f"Source homepage film changed: {d}"
          PY

          # Source scene boundaries verified from the existing 25 fps six-speaker film:
          # original: 0..92 other voices / 92..136.32 Anna / 136.32..201.12 other voices /
          # 201.12..231.12 Anna, then 0.8s outro dissolve and original closing card.
          # Only the Anna sections are replaced. New 0.8s dissolve retains the approved closing card.
          cat > "$TMP/filter.txt" <<'FILTER'
          [0:v]trim=start=0:end=92,setpts=PTS-STARTPTS,fps=25,scale=1920:1080,setsar=1,format=yuv420p[v0];
          [0:a]atrim=start=0:end=92,asetpts=PTS-STARTPTS,aresample=48000[a0];
          [1:v]fps=25,scale=1920:1080,setsar=1,setpts=PTS-STARTPTS,format=yuv420p[v1];
          [1:a]aresample=48000,asetpts=PTS-STARTPTS[a1];
          [0:v]trim=start=136.32:end=201.12,setpts=PTS-STARTPTS,fps=25,scale=1920:1080,setsar=1,format=yuv420p[v2];
          [0:a]atrim=start=136.32:end=201.12,asetpts=PTS-STARTPTS,aresample=48000[a2];
          [2:v]fps=25,scale=1920:1080,setsar=1,setpts=PTS-STARTPTS,format=yuv420p[v3];
          [2:a]aresample=48000,asetpts=PTS-STARTPTS,afade=t=out:st=30.88:d=0.8[a3];
          [0:v]trim=start=232:end=236.96,setpts=PTS-STARTPTS,fps=25,scale=1920:1080,setsar=1,format=yuv420p[v4];
          [v3][v4]xfade=transition=fade:duration=0.8:offset=30.88[closev];
          anullsrc=r=48000:cl=stereo,atrim=duration=4.16,asetpts=PTS-STARTPTS[endsilence];
          [a3][endsilence]concat=n=2:v=0:a=1[closea];
          [v0][a0][v1][a1][v2][a2][closev][closea]concat=n=4:v=1:a=1[v][a]
          FILTER
          sed -i 's/^          //' "$TMP/filter.txt"

          ffmpeg -hide_banner -loglevel error -i "$TMP/original-with-normalized-audio.mp4" \
            -i "$TMP/anna-first.mp4" -i "$TMP/anna-final.mp4" \
            -filter_complex_script "$TMP/filter.txt" -map "[v]" -map "[a]" \
            -c:v libx264 -preset fast -crf 20 -profile:v high -level:v 4.1 \
            -pix_fmt yuv420p -r 25 -g 250 -keyint_min 250 -sc_threshold 0 \
            -force_key_frames "expr:gte(t,n_forced*10)" \
            -c:a aac -b:a 160k -ac 2 -ar 48000 \
            -movflags +faststart -y "$TMP/assembled.mp4"

          ffmpeg -hide_banner -loglevel error -i "$TMP/assembled.mp4" -c copy \
            -f hls -hls_time 10 -hls_playlist_type vod -hls_segment_type fmp4 \
            -hls_fmp4_init_filename "init.mp4" \
            -hls_segment_filename "$TMP/hls/part-%02d.m4s" \
            "$TMP/hls/film.m3u8"
          ffmpeg -v error -i "$TMP/hls/film.m3u8" -f null -

          FINAL_DURATION="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$TMP/hls/film.m3u8")"
          python3 - "$FINAL_DURATION" <<'PY'
          import sys
          d=float(sys.argv[1])
          assert 239.2 <= d <= 241.3, f"Unexpected final running time: {d}"
          print(f"Verified completed homepage film: {d:.3f}s")
          PY
          test -s "$TMP/hls/init.mp4"
          test -s "$TMP/hls/film.m3u8"
          test "$(find "$TMP/hls" -name '*.m4s' | wc -l)" -ge 23

          # Replace only the original film's HLS assets, not the poster, other videos, HTML or CSS.
          rm -f "$SOURCE_DIR"/part-*.m4s "$SOURCE_DIR/film.m3u8" "$SOURCE_DIR/init.mp4"
          cp "$TMP/hls"/init.mp4 "$SOURCE_DIR/init.mp4"
          cp "$TMP/hls"/film.m3u8 "$SOURCE_DIR/film.m3u8"
          cp "$TMP/hls"/part-*.m4s "$SOURCE_DIR/"
          git config user.name "ACA approved homepage media"
          git config user.email "actions@users.noreply.github.com"
          git add -A "$SOURCE_DIR"
          git rm .github/workflows/aca-anna-welcome-replace-once.yml

          # Hard scope boundary: no unapproved page or other speaker file changes.
          python3 - <<'PY'
          import subprocess
          allowed="assets/videos/aca-introduction/"
          names=subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines()
          assert names, "No media staged"
          assert all(x.startswith(allowed) or x==".github/workflows/aca-anna-welcome-replace-once.yml" for x in names), names
          assert "assets/videos/aca-introduction/film.m3u8" in names
          print("Scope check passed; only the homepage film and removal of this temporary workflow are staged")
          PY
          git commit -m "Replace Anna's two ACA homepage welcome appearances only"
          git push origin HEAD:main
          echo "ACA_ANNA_WELCOME_UPDATED=1"
