name: Replace Journey Six avatar voice with Alex Wright
on:
  push:
    branches: [phase-two-six-journey-owner-review]
    paths: [.github/workflows/replace-j6-alex-wright.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.event.head_commit.message == 'Replace Journey Six avatar voice with Alex Wright'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install established application and media dependencies
        run: |
          npm ci
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install 'Pillow==11.2.1'
      - name: Verify protected lesson source and build
        run: npm run check
      - name: Await the six submitted HeyGen render files
        run: |
          python - <<'PYWAIT'
          import json,time,urllib.request,pathlib
          manifests=[json.loads(pathlib.Path(f'academy/phase-two-production/J6-L6-{n}-intro-media-source.json').read_text()) for n in range(1,7)]
          pending={n+1:m['source_url'] for n,m in enumerate(manifests)}
          deadline=time.monotonic()+2400
          while pending and time.monotonic()<deadline:
              for n,url in list(pending.items()):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,method='HEAD'),timeout=20) as response:
                          if response.status==200 and int(response.headers.get('Content-Length','0'))>1_000_000:
                              print(f'Lesson 6.{n}: render file ready',flush=True)
                              del pending[n]
                  except Exception as error:
                      print(f'Lesson 6.{n}: awaiting submitted render ({type(error).__name__})',flush=True)
              if pending:time.sleep(30)
          assert not pending, f'Submitted HeyGen renders still pending: {list(pending)}'
          PYWAIT
      - name: Assemble only corrected instructor introductions
        run: |
          for n in 1 2 3 4 5 6; do
            python "academy/phase-two-production/build-approved-j6${n}-video.py" "$RUNNER_TEMP/intro-$n"
          done
      - name: Replace only six avatar introductions
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "33f06dec9fbdd6948c0b9b31bcf4754aa75269ef"
          git worktree add --detach "$RUNNER_TEMP/aca-official" origin/main
          cd "$RUNNER_TEMP/aca-official"
          for n in 1 2 3 4 5 6; do
            dest="assets/videos/phase-two-lesson-6-$n"
            test -f "$dest/ACA-Phase-Two-Lesson-6-$n-Introduction-wide.mp4"
            test -f "$dest/media-manifest.json"
            cmp "$dest/poster-wide.webp" "$RUNNER_TEMP/intro-$n/poster-wide.webp"
            cp "$RUNNER_TEMP/intro-$n/ACA-Phase-Two-Lesson-6-$n-Introduction-wide.mp4" "$dest/"
            cp "$RUNNER_TEMP/intro-$n/media-manifest.json" "$dest/"
            git add "$dest/ACA-Phase-Two-Lesson-6-$n-Introduction-wide.mp4" "$dest/media-manifest.json"
          done
          git diff --cached --name-status
          python - <<'PY'
          import subprocess,re
          lines=subprocess.check_output(['git','diff','--cached','--name-status'],text=True).splitlines()
          expected={f'assets/videos/phase-two-lesson-6-{n}/{name}' for n in range(1,7) for name in [f'ACA-Phase-Two-Lesson-6-{n}-Introduction-wide.mp4','media-manifest.json']}
          seen=set()
          for line in lines:
              status,path=line.split('\t')
              if path in expected:
                  assert status=='M',line
                  seen.add(path)
              else:
                  raise AssertionError(line)
          assert seen==expected,(seen,expected)
          PY
          git config user.name 'ACA official review builder'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Replace six Journey Six avatar voices with Alex Wright'
          git push origin HEAD:main
